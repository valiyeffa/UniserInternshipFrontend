<div class="flex flex-col rounded-2xl border border-slate-200 bg-white p-2 shadow-sm">
    @for (item of subMenus; track item.id) {
    <button
        [routerLink]="item.link"
        routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-500"
        [routerLinkActiveOptions]="{ exact: true }"
        class="mb-1 flex h-12 items-center rounded-xl border border-transparent px-4 text-left text-sm font-semibold text-slate-600 transition hover:border-indigo-200 hover:bg-indigo-50 hover:text-indigo-700 cursor-pointer">
        {{item.value}}
    </button>
    }
</div>
