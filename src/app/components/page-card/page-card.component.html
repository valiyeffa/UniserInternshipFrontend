<mat-card class="h-full rounded-2xl border border-slate-200 bg-white p-2 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md" appearance="outlined">
  <mat-card-header class="mb-3">
    <!-- <img src="{{item.icon}}" alt={{item.value}}> -->
    <mat-card-title class="text-lg font-semibold text-slate-800">{{item.value}}</mat-card-title>
  </mat-card-header>
  <mat-card-content class="pt-1">
    <a
      routerLink="{{item.url}}"
      class="inline-flex items-center rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white transition hover:bg-indigo-700"
    >
      Go to page
    </a>
  </mat-card-content>
</mat-card>
