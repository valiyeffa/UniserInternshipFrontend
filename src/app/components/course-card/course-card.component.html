<mat-card class="example-card h-130" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{item.title}}</mat-card-title>
    <mat-card-subtitle>{{item.category}}</mat-card-subtitle>
  </mat-card-header>
  <img mat-card-image class="h-75" src={{item.thumbnail}} alt="Photo of a Shiba Inu">
  <mat-card-content>
    <p>{{item.description}}</p>
  </mat-card-content>
  <mat-card-actions class="flex justify-between">
    <div>
      <del>{{item.price}} AZN</del>
      <span> {{item.discountPrice}}AZN</span>
    </div>
    <span>Rating: {{item.rating}}</span>
  </mat-card-actions>

  <div class="example-button-row">
    <a mat-button="filled" href="#" [disabled]="!item.isPopular" target="_blank">Register</a>
    <!-- @if (item.isPopular) {
    <a mat-button="filled" href="#" target="_blank">Register</a>
    } @else {
    <a mat-button="filled" href="#" disabled target="_blank">Registeration close</a>
    } -->
  </div>

</mat-card>
