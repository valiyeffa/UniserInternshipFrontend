<mat-card class="example-card h-50" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{item.firstName}} {{item.lastName}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{item.email}}</p>
  </mat-card-content>
  <div class="flex flex-col justify-between my-5 mx-4">
    <span>Phone: {{item.phone}}</span>
    <span>Gender: {{item.gender}}</span>
    <span>Age: {{item.age}}</span>
  </div>
</mat-card>
