<div class="container">
  <h1>Angular 19 Practice</h1>

  <p><strong>Ad:</strong> {{ name }}</p>
  <p><strong>Yaş:</strong> {{ age }}</p>
  <p><strong>Tələbədirmi?:</strong> {{ isStudent }}</p>

  <hr>

  <input [(ngModel)]="inputValue" placeholder="Type something..." />

  <p><strong>Input dəyəri:</strong> {{ inputValue }}</p>

  <button (click)="setValue()">Inputa dəyər yaz</button>
  <button (click)="clearInput()">Inputu sıfırla</button>

  <hr>

  <h2>Todo App</h2>

  <input [(ngModel)]="newTodo" placeholder="Yeni tapşırıq yaz..." />
  <button (click)="addTodo()">Əlavə et</button>

  <ul>
    <li *ngFor="let todo of todos; let i = index">
      {{ todo }}
      <button (click)="deleteTodo(i)">Sil</button>
    </li>
  </ul>
</div>
