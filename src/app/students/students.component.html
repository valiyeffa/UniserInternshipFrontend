<div class="container p-10">
  <h1>List of students</h1>
  <time>{{ tarix | date:'medium' }}</time>
  <p>{{ myName | fullnameconverter }}</p>

  <div class="text-right">
    <input type="text" placeholder="search student" class="p-1 text-black" [(ngModel)]="filterName">
  </div>

  <form [formGroup]="studentForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2 p-2">

    <div>
      <input type="text" placeholder="name" formControlName="name" class="p-1 text-black">
      <span *ngIf="studentForm.get('name')?.invalid && studentForm.get('name')?.touched" class="text-white ml-2">
        Name required, min 3 chars
      </span>
    </div>

    <div>
      <input type="text" placeholder="surname" formControlName="surname" class="p-1 text-black">
      <span *ngIf="studentForm.get('surname')?.invalid && studentForm.get('surname')?.touched" class="text-white ml-2">
        Surname required, min 3 chars
      </span>
    </div>

    <div>
      <input type="email" placeholder="email" formControlName="email" class="p-1 text-black">
      <span *ngIf="studentForm.get('email')?.invalid && studentForm.get('email')?.touched" class="text-white ml-2">
        Valid email required
      </span>
    </div>

    <div>
      <input type="number" placeholder="age" formControlName="age" class="p-1 text-black">
      <span *ngIf="studentForm.get('age')?.invalid && studentForm.get('age')?.touched" class="text-white ml-2">
        Age must be 18+
      </span>
    </div>

   
    <button
      type="submit"
      class="p-2 bg-blue-600 rounded-xl text-sm w-fit"
      [ngClass]="{'bg-yellow-600': studentForm.invalid}">
      add student
    </button>

  </form>

  <app-student-list [students]="filteredStudents" (deleteStudent)="deleteStudent($event)"></app-student-list>
</div>
