<div class="thin-scrollbar h-full max-h-[calc(100vh-70px)] w-full overflow-y-auto rounded-2xl border border-indigo-100 bg-white/95 p-6 shadow-sm">
  <div class="mb-6">
    <h1 class="text-3xl font-bold tracking-tight text-slate-900">Welcome back!</h1>
    <p class="mt-2 text-sm text-slate-500">Select a module to continue your workflow.</p>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (item of modules; track item.id) {
    <app-page-card [item]="item"></app-page-card>
    }
  </div>
</div>
