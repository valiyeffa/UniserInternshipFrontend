<div class="mt-1 flex flex-col gap-3 bg-white p-4">
    <b class="text-center text-2xl">CONTRACTS</b>
    <button mat-button (click)="openDialog()"
        class="w-fit cursor-pointer rounded-lg border border-indigo-200 bg-indigo-50 p-2 text-indigo-700 hover:bg-indigo-100 transition">+
        Add Contract</button>

    <div class="w-full overflow-hidden rounded-lg border border-slate-200">
        <div class="thin-scrollbar h-93 w-full overflow-auto">
            <form [formGroup]="filterForm">
                <!-- <button type="submit" class="hidden"></button> -->
                <table class="min-w-full text-sm text-left border-separate border-spacing-y-2">
                    <thead>
                        <tr>
                            <th colspan="7"
                                class="rounded-xl bg-slate-100 px-6 py-4 text-center align-top text-xs font-semibold uppercase tracking-wide text-slate-700">
                                Contracts
                            </th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="bg-slate-50">
                            <th
                                class="rounded-l-xl px-6 py-3 whitespace-nowrap text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                <div class="inputbox">
                                    <input (keydown.enter)="handleFilter()" formControlName="contractType"
                                        required="required" type="text" id="contractType">
                                    <span class="flex items-center justify-between gap-3">
                                        Contract type
                                    </span>
                                    <i></i>
                                </div>
                            </th>
                            <th
                                class="px-6 whitespace-nowrap py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                <div class="inputbox">
                                    <input (keydown.enter)="handleFilter()" formControlName="company"
                                        required="required" type="text" id="company">
                                    <span class="flex items-center justify-between gap-3">
                                        Company
                                    </span>
                                    <i></i>
                                </div>
                            </th>
                            <th
                                class="px-6 py-3 whitespace-nowrap text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                <div class="inputbox">
                                    <input (keydown.enter)="handleFilter()" formControlName="contractNo"
                                        required="required" type="text" id="contractNo">
                                    <span class="flex items-center justify-between gap-3">
                                        Contract №
                                    </span>
                                    <i></i>
                                </div>
                            </th>
                            <th
                                class="px-6 py-3 whitespace-nowrap text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                <div class="inputbox">
                                    <input (keydown.enter)="handleFilter()" formControlName="contractDate"
                                        required="required" type="text" id="contractDate">
                                    <span class="flex items-center justify-between gap-3">
                                        Contract date
                                    </span>
                                    <i></i>
                                </div>
                            </th>
                            <th
                                class="px-6 py-3 whitespace-nowrap text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                <div class="inputbox">
                                    <input (keydown.enter)="handleFilter()" formControlName="effectiveDate"
                                        required="required" type="text" id="effectiveDate">
                                    <span class="flex items-center justify-between gap-3">
                                        Effective date
                                    </span>
                                    <i></i>
                                </div>
                            </th>
                            <th
                                class="px-6 py-3 whitespace-nowrap text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                <div class="inputbox">
                                    <input (keydown.enter)="handleFilter()" formControlName="endDate"
                                        required="required" type="text" id="endDate">
                                    <span class="flex items-center justify-between gap-3">
                                        End date
                                    </span>
                                    <i></i>
                                </div>
                            </th>
                            <th
                                class="rounded-r-xl px-6 py-3 whitespace-nowrap text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                                Tools
                            </th>
                        </tr>

                        @for (i of tableRows; track i.id) {
                        <tr class="bg-white transition hover:bg-indigo-50/40">
                            <td class="rounded-l-xl border-y border-l whitespace-nowrap border-slate-200 px-6 py-4">{{
                                i.contractType }}</td>
                            <td class="border-y whitespace-nowrap border-slate-200 px-6 py-4">{{ i.company }}</td>
                            <td class="border-y whitespace-nowrap border-slate-200 px-6 py-4">{{ i.contractNo }}</td>
                            <td class="border-y whitespace-nowrap border-slate-200 px-6 py-4">{{ i.contractDate }}</td>
                            <td class="border-y whitespace-nowrap border-slate-200 px-6 py-4">{{ i.effectiveDate }}</td>
                            <td class="border-y whitespace-nowrap border-slate-200 px-6 py-4">{{ i.endDate }}</td>
                            <td class="rounded-r-xl border-y border-r border-slate-200 px-6 py-4">
                                <div class="flex gap-3">
                                    <button type="button" mat-button (click)="openEditDialog(i)"
                                        class="cursor-pointer rounded-lg border border-amber-300 bg-amber-100 p-2 transition hover:bg-amber-200">Edit</button>
                                    <button type="button"
                                        class="cursor-pointer rounded-lg border border-red-300 bg-red-100 p-2 transition hover:bg-red-200">Delete</button>
                                </div>
                            </td>
                        </tr>
                        }
                    </tbody>
                </table>
            </form>
        </div>

        <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-4">
            <p class="text-sm text-slate-500">Page {{ currentPage() }} / {{ totalPages }}</p>
            <div class="flex gap-2">
                <button (click)="prevPage()" [disabled]="currentPage() === 1"
                    class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 transition enabled:hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
                    Previous
                </button>
                <button (click)="nextPage()" [disabled]="currentPage() === totalPages"
                    class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 transition enabled:hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
                    Next
                </button>
            </div>
        </div>
    </div>
</div>
