<div class=" bg-white p-6 ">
    <h2 class="text-2xl font-bold tracking-tight text-slate-900 text-center">Contracts</h2>
    <div class="thin-scrollbar h-105 overflow-auto">
        <table class="min-w-full text-sm text-left border-separate border-spacing-y-2">
            <thead>
                <tr>
                    <th colspan="4"
                        class="rounded-xl bg-slate-100 px-6 py-4 text-center align-top text-xs font-semibold uppercase tracking-wide text-slate-700">
                        TABLE
                    </th>
                </tr>
            </thead>

            <tbody>
                <tr class="bg-slate-50">
                    <th
                        class="rounded-l-xl px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                        No</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Data
                    </th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Info
                    </th>
                    <th
                        class="rounded-r-xl px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                        Tools</th>
                </tr>

                @for (row of paginatedRows; track row.id) {
                <tr class="bg-white transition hover:bg-indigo-50/40">
                    <td class="rounded-l-xl border-y border-l border-slate-200 px-6 py-4">{{ row.id }}</td>
                    <td class="border-y border-slate-200 px-6 py-4">{{ row.data }}</td>
                    <td class="border-y border-slate-200 px-6 py-4">{{ row.info }}</td>
                    <td class="rounded-r-xl border-y border-r border-slate-200 px-6 py-4">{{ row.tools }}</td>
                </tr>
                }
            </tbody>

        </table>
    </div>

    <div class="mt-4 flex items-center justify-between border-t border-slate-100 pt-4">
        <p class="text-sm text-slate-500">Page {{ currentPage }} / {{ totalPages }}</p>
        <div class="flex gap-2">
            <button (click)="prevPage()" [disabled]="currentPage === 1"
                class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 transition enabled:hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
                Previous
            </button>
            <button (click)="nextPage()" [disabled]="currentPage === totalPages"
                class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-medium text-slate-600 transition enabled:hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50">
                Next
            </button>
        </div>
    </div>
</div>
