<div class="flex h-[430px] w-[560px] flex-col gap-3 p-5">
    <form [formGroup]="form" (ngSubmit)="addRolesToUser()">
        <div class="thin-scrollbar h-[300px] overflow-auto rounded-xl border border-slate-200 bg-slate-50 p-3">
            @for (item of userRoles; track item.roleId) {
            <div class="mb-2 flex items-center justify-between rounded-lg border border-slate-100 bg-white px-3 py-2">
                <p class="text-sm font-semibold text-slate-700">{{ item.roleName }}</p>
                <input type="checkbox" [checked]="item.assignStatus" (change)="checkedData($event, item.roleId)" />
            </div>
            }
        </div>

        <mat-dialog-actions align="end">
            <button mat-button mat-dialog-close>Cancel</button>
            <button mat-button [mat-dialog-close]="true" type="submit"
                class="ml-3 cursor-pointer rounded-lg bg-indigo-600 px-5 py-2 text-white transition hover:bg-indigo-700">
                Save
            </button>
        </mat-dialog-actions>
    </form>
</div>
