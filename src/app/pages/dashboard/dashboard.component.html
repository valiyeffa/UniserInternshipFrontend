<div class="dashboard">
  <div class="loading" *ngIf="isLoading">
    <div class="spinner"></div>
    <p>Yüklənir...</p>
  </div>

  <div class="error-box" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && !errorMessage">
    <div class="modules-grid">
      <div
        class="module-card"
        *ngFor="let module of modules; let i = index"
        [class.active]="i === activeIndex"
        (click)="navigate(module.value, i)"
        style="cursor: pointer;"
      >
        <div class="module-icon-box">{{ getIcon(module.value) }}</div>
        <div class="module-bg-icon">{{ getIcon(module.value) }}</div>
        <div class="module-name">{{ module.value }}</div>
        <div class="module-underline"></div>
      </div>
    </div>
  </div>
</div>
