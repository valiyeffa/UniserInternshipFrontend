<div class="login-wrapper">

  <!-- SOL: Form panel -->
  <div class="form-panel">
    <div class="form-container">

      <div class="logo-area">
        <img  src="/logo.png" alt="Eurasia Logo" class="logo-img" />
      </div>

      <div class="form-header">
        <h2>Xoş gəlmisiniz</h2>
        <p>Hesabınıza daxil olun</p>
      </div>

      <div class="alert-error" *ngIf="errorMessage">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

        <div class="field-group">
          <label class="field-label">İstifadəçi adı</label>
          <div class="input-wrap"
            [class.input-error]="username?.invalid && username?.touched"
            [class.input-focus]="usernameFocused">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" formControlName="username" placeholder="İstifadəçi adı"
              class="field-input"
              (focus)="usernameFocused = true" (blur)="usernameFocused = false"/>
          </div>
          <span class="field-error" *ngIf="username?.invalid && username?.touched">
            {{ username?.errors?.['required'] ? 'Bu sahə məcburidir' : 'Minimum 3 simvol' }}
          </span>
        </div>

        <div class="field-group">
          <label class="field-label">Şifrə</label>
          <div class="input-wrap"
            [class.input-error]="password?.invalid && password?.touched"
            [class.input-focus]="passwordFocused">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
              placeholder="Şifrə" class="field-input"
              (focus)="passwordFocused = true" (blur)="passwordFocused = false"/>
            <button type="button" class="toggle-pass" (click)="showPassword = !showPassword">
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="field-error" *ngIf="password?.invalid && password?.touched">
            {{ password?.errors?.['required'] ? 'Bu sahə məcburidir' : 'Minimum 6 simvol' }}
          </span>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Daxil ol</span>
          <span *ngIf="isLoading" class="btn-loading">
            <span class="spinner"></span> Yüklənir...
          </span>
        </button>

      </form>

      <div class="form-footer">
        <span>Powered by UNISER Group</span>
        <span>EURASIA © 2026</span>
      </div>

    </div>
  </div>

  <!-- SAĞ: Şəkil panel -->
<div class="image-panel">
  <div class="image-card">
    <img src="/login_main1.png" 
         alt="Liman" class="port-img" />
    <div class="img-overlay"></div>
    <div class="img-caption">
      <span>Caspian Sea Terminal Operations</span>
    </div>
  </div>
</div>

</div>
